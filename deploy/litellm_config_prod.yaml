# Production LiteLLM config (deploy/Dockerfile copies it to /app/config.yaml).
#
# Every route is served by Amazon Bedrock in this AWS account
# (infra/DESIGN.md, decision 3), reached through a VPC endpoint. Credentials
# come from the ECS task role, which may invoke only the models listed in
# infra/variables.tf (bedrock_model_ids); keep the two in step.
#
# Clients ask for "llm". The router's policy (deploy/policy.yaml) sends risky
# or sensitive turns to the hardened, quarantine or sensitive groups instead.

model_list:
  - model_name: llm
    litellm_params:
      model: bedrock/converse/openai.gpt-oss-120b-1:0
      aws_region_name: os.environ/AWS_REGION_NAME
    model_info:
      supports_function_calling: true

  - model_name: hardened
    litellm_params:
      model: bedrock/converse/openai.gpt-oss-120b-1:0
      aws_region_name: os.environ/AWS_REGION_NAME
    model_info:
      supports_function_calling: true

  - model_name: quarantine
    litellm_params:
      model: bedrock/converse/openai.gpt-oss-120b-1:0
      aws_region_name: os.environ/AWS_REGION_NAME

  # Sensitive data (#181) is cleared for this group. On Bedrock in this
  # account, prompts are not stored or used for training, and the data stays
  # in the account's region. A self-hosted model would keep it inside the task.
  - model_name: sensitive
    litellm_params:
      model: bedrock/converse/openai.gpt-oss-120b-1:0
      aws_region_name: os.environ/AWS_REGION_NAME
    model_info:
      supports_function_calling: true
      cleared_for: [sensitive]

litellm_settings:
  drop_params: true
  callbacks: ["router.hook.proxy_handler_instance"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Revoking an agent's key takes effect within this many seconds (#148).
  user_api_key_cache_ttl: 5
