# Production LiteLLM config — no mock-model entry (mock is local dev only).
# Secrets injected by ECS as env vars; never hardcode values here.

model_list:
  - model_name: groq
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  - model_name: llm
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  # Routing tier (#140): requests at elevated risk are sent to this group.
  # Same model as standard for now; the tier's protection comes from the
  # controls the hook enforces for the route.
  - model_name: hardened
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

litellm_settings:
  drop_params: true
  callbacks: ["router.hook.proxy_handler_instance"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
