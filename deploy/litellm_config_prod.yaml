# Production LiteLLM config — no mock-model entry (mock is local dev only).
# Secrets injected by ECS as env vars; never hardcode values here.

model_list:
  - model_name: groq
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  - model_name: llm
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  # Routing tier (#140): requests at elevated risk are sent to this group.
  # Same model as standard for now; the tier's protection comes from the
  # controls the hook enforces for the route.
  - model_name: hardened
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  # Routing tier (#183): high-risk requests, tools removed. Groq until a
  # self-hosted model exists, so production needs no extra infrastructure.
  - model_name: quarantine
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY

  # Sensitive data (#181): requests carrying secrets or personal data never
  # go to Groq. They are served by the Ollama sidecar in the same ECS task
  # (infra/ecs.tf), reachable only on the task's localhost.
  - model_name: sensitive
    litellm_params:
      model: ollama_chat/qwen2.5:1.5b
      api_base: http://localhost:11434
    model_info:
      supports_function_calling: true
      cleared_for: [sensitive]

litellm_settings:
  drop_params: true
  callbacks: ["router.hook.proxy_handler_instance"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
