model_list:
  - model_name: mock
    litellm_params:
      model: openai/mock-gpt-4
      api_base: http://127.0.0.1:8001/v1
      api_key: "sk-fake"

  # Routing tier (#140): requests at elevated risk are sent to this group.
  - model_name: hardened
    litellm_params:
      model: openai/mock-gpt-4
      api_base: http://127.0.0.1:8001/v1
      api_key: "sk-fake"
    model_info:
      supports_function_calling: true

  # Routing tier (#183): high-risk requests, tools removed. Mock for local dev;
  # the demo stack serves it from a local Ollama model.
  - model_name: quarantine
    litellm_params:
      model: openai/mock-gpt-4
      api_base: http://127.0.0.1:8001/v1
      api_key: "sk-fake"

  # Sensitive data (#181): requests carrying secrets or personal data. Mock
  # here so the eval and CI stay deterministic; the demo and production serve
  # it from a local Ollama model. Only deployments cleared for sensitive data
  # may be used by the sensitive routes (checked at startup).
  - model_name: sensitive
    litellm_params:
      model: openai/mock-gpt-4
      api_base: http://127.0.0.1:8001/v1
      api_key: "sk-fake"
    model_info:
      supports_function_calling: true
      cleared_for: [sensitive]

litellm_settings:
  drop_params: true
  callbacks: ["router.hook.proxy_handler_instance"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
