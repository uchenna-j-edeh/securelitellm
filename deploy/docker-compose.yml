services:
  litellm:
    # Pin the exact image used for the verified M1 environment.
    image: ghcr.io/berriai/litellm@sha256:a69f5f0c56b868d2fdfce7abfb037fed947b70ede202047ffc19c14dc96ab90a
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ..:/workspace:ro           # router/ package available via PYTHONPATH
    command: --config /app/config.yaml --port 4000
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - PYTHONPATH=/workspace
      - ROUTER_MODE=${ROUTER_MODE:-session}
      - ROUTER_LEVEL=${ROUTER_LEVEL:-L3}
      - ROUTER_LOG_PATH=${ROUTER_LOG_PATH:--}   # default: stdout
      - CLASSIFIER_BACKEND=${CLASSIFIER_BACKEND:-none}
      - PROMPTGUARD_THRESHOLD=${PROMPTGUARD_THRESHOLD:-0.5}
      - ROUTER_ENFORCE=${ROUTER_ENFORCE:-true}
      - ROUTER_HARDENED_MODEL=${ROUTER_HARDENED_MODEL:-mock}
      - POLICY_PATH=${POLICY_PATH:-/workspace/deploy/policy.yaml}
    depends_on:
      mock-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-model:
    build:
      context: ./mock_model
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - MOCK_SCRIPT=${MOCK_SCRIPT:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
