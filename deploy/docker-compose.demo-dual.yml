# Demo dual-proxy overlay — live A/B for the delayed-exfil demo.
#
# Adds a SECOND proxy, litellm-stateless, on :4001 running ROUTER_MODE=stateless,
# alongside the default session-mode proxy on :4000. Both share the same local
# DeBERTa classifier sidecar, mock model and policy, so the ONLY difference
# between them is the routing mode — exactly the variable the demo isolates.
#
# Usage (from repo root). Use make: it generates the demo policy first. Raw
# docker compose needs `python scripts/demo_policy.py` (with deploy/.env loaded)
# run beforehand.
#   docker compose --env-file deploy/.env \
#                  -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.classifier.yml \
#                  -f deploy/docker-compose.demo-dual.yml \
#                  up -d --build
#
# Or: make demo-dual-up
#
#   session proxy    → http://localhost:4000
#   stateless proxy  → http://localhost:4001
#
# Both proxies run deploy/policy.demo.yaml: the bundled policy with the winning
# switches (classifier + allowlist + user_named) and this clone's demo recipient allowed.
# `make demo-dual-up` generates it (scripts/demo_policy.py).
#
# Both proxies use litellm_config.demo.yaml, where the quarantine model group
# is a local Ollama model (#183): high-risk context never leaves the machine.
# First start pulls the model (~1 GB) into a named volume.
#
# Agent identity (#148): both proxies share a Postgres database, which LiteLLM
# needs for virtual keys. `make demo-dual-up` registers the demo agent and its
# key (scripts/demo_agents.py). With ROUTER_REQUIRE_AGENT_KEY=true the master
# key can administer keys but can't send model requests.

services:
  # LiteLLM's key store. Not published on the host: only the two proxies reach it.
  agents-db:
    image: postgres@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663  # 16-alpine
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_DB=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env (make demo-dual-up does)}
    volumes:
      - agents_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama@sha256:1bef639749741b375e9a1eb2c1346fb57ce52f5432de1f74846e44ccc18e1687  # 0.40.0
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: pull the quarantine model, then exit. Proxies wait for it.
  ollama-pull:
    image: ollama/ollama@sha256:1bef639749741b375e9a1eb2c1346fb57ce52f5432de1f74846e44ccc18e1687  # 0.40.0
    entrypoint: ["ollama", "pull", "qwen2.5:1.5b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # The demo UI shows which route answered each model call (#140). Never
  # enable the route header in production: ROUTER_LOCK rejects it.
  litellm:
    environment:
      - ROUTER_ROUTE_HEADER=true
      - POLICY_PATH=/workspace/deploy/policy.demo.yaml
      - ROUTER_LITELLM_CONFIG=/app/config.yaml
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:-}@agents-db:5432/litellm
      - ROUTER_REQUIRE_AGENT_KEY=true
    volumes:
      - ./litellm_config.demo.yaml:/app/config.yaml:ro
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      agents-db:
        condition: service_healthy

  litellm-stateless:
    image: ghcr.io/berriai/litellm@sha256:a69f5f0c56b868d2fdfce7abfb037fed947b70ede202047ffc19c14dc96ab90a
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - ./litellm_config.demo.yaml:/app/config.yaml:ro
      - ..:/workspace:ro
    command: --config /app/config.yaml --port 4000
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - PYTHONPATH=/workspace
      - ROUTER_MODE=stateless
      - ROUTER_LEVEL=${ROUTER_LEVEL:-L3}
      - ROUTER_LOG_PATH=-
      - CLASSIFIER_BACKEND=local
      - LOCAL_CLASSIFIER_URL=http://local-classifier:8080
      - PROMPTGUARD_THRESHOLD=${PROMPTGUARD_THRESHOLD:-0.5}
      - ROUTER_ENFORCE=${ROUTER_ENFORCE:-true}
      - ROUTER_LITELLM_CONFIG=/app/config.yaml
      - ROUTER_ROUTE_HEADER=true
      - POLICY_PATH=/workspace/deploy/policy.demo.yaml
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:-}@agents-db:5432/litellm
      - ROUTER_REQUIRE_AGENT_KEY=true
    depends_on:
      mock-model:
        condition: service_healthy
      local-classifier:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      # The session proxy applies the database migrations first; starting both
      # against an empty database at once would race.
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_models:
  agents_db:
