name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Throwaway database for the Postgres session store tests (#169).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sessions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_SESSION_DB_URL: postgresql://postgres:test@127.0.0.1:5432/sessions
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.21"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Validate corpus scenarios
        run: uv run python corpus/validate.py

      - name: Unit tests
        run: uv run pytest tests/ -v --ignore=tests/test_e2e.py

      # The same suite again with every fixture-built session store on Postgres:
      # decisions must not depend on the backend (#169).
      - name: Unit tests on the Postgres session store
        env:
          TEST_SESSION_BACKEND: postgres
        run: uv run pytest tests/ -q --ignore=tests/test_e2e.py

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.21"

      - name: Windows setup
        shell: pwsh
        run: .\scripts\dev.ps1 setup

      - name: Windows lint
        shell: pwsh
        run: .\scripts\dev.ps1 lint

      - name: Validate corpus scenarios
        shell: pwsh
        run: .\scripts\dev.ps1 validate

      - name: Windows unit tests
        shell: pwsh
        run: .\scripts\dev.ps1 test

      - name: Windows evaluation dry-run
        shell: pwsh
        run: .\scripts\dev.ps1 eval-dry

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Validate
        run: |
          for dir in infra infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.21"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Start stack
        working-directory: deploy
        env:
          LITELLM_MASTER_KEY: sk-test-ci-e2e-key
          GROQ_API_KEY: ""
          CLASSIFIER_BACKEND: mock
          ROUTER_MODE: stateless
        run: docker compose up -d

      - name: Wait for healthy
        run: |
          for i in $(seq 1 24); do
            hs=$(docker inspect --format='{{.State.Health.Status}}' deploy-litellm-1 2>/dev/null || echo "missing")
            echo "[$i] litellm: $hs"
            [ "$hs" = "healthy" ] && exit 0
            sleep 5
          done
          echo "Timed out waiting for litellm to become healthy"
          docker logs deploy-litellm-1
          exit 1

      - name: E2E tests
        env:
          E2E_BASE_URL: http://localhost:4000
          E2E_MASTER_KEY: sk-test-ci-e2e-key
        run: uv run pytest tests/test_e2e.py -v -m e2e

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== litellm logs ==="
          docker logs deploy-litellm-1
          echo "=== mock-model logs ==="
          docker logs deploy-mock-model-1

      - name: Tear down
        if: always()
        working-directory: deploy
        env:
          LITELLM_MASTER_KEY: sk-test-ci-e2e-key
          GROQ_API_KEY: ""
          CLASSIFIER_BACKEND: mock
        run: docker compose down
