[project]
name = "securelitellm"
version = "0.0.1"
description = "Risk-based LLM router with session taint tracking — capstone evaluation instrument"
requires-python = ">=3.11"
dependencies = [
    "litellm[proxy]>=1.40.0,<2.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["bootstrap_github.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that require a live Docker or native Windows stack",
]
